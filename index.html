<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Autobattler</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <header>
            <h1>SNAKE AUTOBATTLER</h1>
            <div id="status-bar">
                <span>🏆 Wins: <span id="wins">0</span></span>
                <span>💔 Hearts: <span id="hearts">5</span></span>
                <span>🪙 Gold: <span id="gold">10</span></span>
            </div>
        </header>
        <main>
            <div id="battle-area">
                <canvas id="game-canvas"></canvas>
            </div>
            <div id="shop-area" class="hidden">
                <!-- Drafting UI here -->
            </div>
        </main>
        <footer>
            <button id="start-btn">START BATTLE</button>
        </footer>
    </div>
    <script type="module" src="js/engine.js"></script>
</body>

</html>
